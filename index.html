<script>
    var number = 0
    var rat = 1
    var theratteramount = 0

function flip(){
    number +=  rat;

    document.getElementById("seb").innerHTML = number+" $";
}
function rat(){
    number -= 1
        document.getElementById("seb").innerHTML = number+" $";
}
function buyrat(){
    if (number >= rat*rat){
     number -= rat*rat
     rat += 1
       var ratprice = rat*rat
            document.getElementById("seb").innerHTML = number+" $";
     document.getElementById("Rats").innerHTML = rat+" rats";
     document.getElementById("Ratprice").innerHTML = "ratprice = $"+ratprice
    }
}
function theratter(){
theratteramount += 1;
          document.getElementById("theratter").innerHTML = "theratter amount = "+theratteramount;
}
    if (theratteramount > 0){
        setInterval(function(){;
        number += theratteramount;

        document.getElementById("seb").innerHTML = number +" $";
        document.getElementById("theratter").innerHTML = theratteramount;

    },100)};

</script>
